# File-class registry, plus the dead config of a retired Routine.
#
# NOTHING READS THIS FILE (DEC-S040). The Routine is off (DEC-S038) and now
# unrevivable; @sync-config, /pull-seeds and /push-seeds are deleted. Every
# automated consumer this file ever had is gone.
#
# It stays for one reason: `file-classes:` below is the answer to the question
# a manual copy actually asks — "is this file identical across every project
# and safe to `cp` wholesale, or is it project-owned and must never be copied
# at all?" That is now documentation for a human, not config for a machine.
#
#   logic   → copy wholesale; seeds is canonical
#   context → never copy; the project owns its version
#   hybrid  → copy the shell only; the paired context file is project-owned
#
# The scheduling keys below — exclude, require, directions, PR/branch prefixes,
# the rolling-issue numbers, digest — describe a mechanism that no longer
# exists. They are kept as a record of what it did, not as a switch. Reviving
# scheduled sync means designing it again from DEC-S004/S010/S028/S038/S040.
#
# Direction model (DEC-S003, DEC-S010):
#   upstream   = project → seeds (backport improvements that emerged in projects)
#   downstream = seeds → project (propagate template changes outward)
#
# Active set comes from the Routine form's repo chip area on claude.ai —
# NOT from an org scan. The first run (2026-05-08) tried to enumerate
# `mobiustripper42/*` via the GitHub API and ate 17 access denials per pass
# because OAuth scope is per-repo. The form is now the single source of
# truth for which repos this Routine can reach. To add a project to the
# active set: open the Routine in /web-setup and add it to the repo chips.
# To remove: remove the chip. No config change needed for either.
#
# Schema-version gating: the Routine still honors `seeds-version` per
# project. If a project's `.claude/seeds-version` doesn't match
# `seeds-version`, that repo is skipped this run and logged to the
# migration backlog issue.

# Repos to never sync, even if the Routine form grants access. Match by
# full `org/repo` path. Seeds itself is here because seeds doesn't sync
# into seeds — and the form has to grant seeds access for the Routine
# to read this very config file, so we exclude it explicitly.
exclude:
  - mobiustripper42/seeds
  # Retired projects — no longer actively developed; kept out of sync so they
  # stop surfacing as schema-version gaps in the migration backlog (2026-06-07).
  - mobiustripper42/crewbook
  - mobiustripper42/crewculator

# A repo joins the active set only if every condition here is true.
# These run AFTER the form has already determined which repos this
# session can access — they're a second filter, not the access gate.
require:
  # Must have `.claude/seeds-version` at the default branch HEAD.
  has_seeds_version: true
  # Must not be archived on GitHub.
  not_archived: true
  # Must have at least one commit on the default branch (excludes brand-new
  # empty repos where there's nothing to diff against yet).
  has_commits_on_default_branch: true

# Which directions to run nightly. Comment one out to disable that direction.
# Both run in the same Routine session; per-direction PRs are opened
# independently per repo (see DEC-S010).
directions:
  - upstream
  - downstream

# Per-direction PR title prefixes. The Routine appends ` — <repo> — <date>`.
pr_title_prefix:
  upstream: "auto-sync upstream"
  downstream: "auto-sync downstream"

# Branch name prefixes used when opening PRs. The Routine appends `/<date>`
# (and `/<repo-slug>` for downstream PRs opened in target projects).
branch_prefix:
  upstream: "auto-sync/upstream"
  downstream: "auto-sync/downstream"

# --- Rolling-issue handles + fleet-status digest (DEC-S028) ---
# The Routine addresses its two rolling issues by PINNED NUMBER, not by title
# search. A stateless nightly run can't reliably find its own prior artifact by
# title, so title-search-and-create spawned a fresh issue every night — 34 open
# `routine: last run` issues had accreted before this was caught. A stable
# handle stops the accretion by construction: the Routine edits the body of THIS
# issue number in place. Bootstrap once — create the issue, paste its number
# here. Until a number is set the Routine falls back to create-once and logs the
# number it created so it can be pinned (it cannot edit this config itself; that
# goes through a normal PR, see the Routine's Step 5).
#
#   last_run_issue — the operational "did sync do anything?" summary (Step 4).
#   status_issue   — the portfolio-view fleet-status digest (Step 4.5).
# Two concerns, two issues. Leave null to trigger the bootstrap fallback.
last_run_issue: 130
status_issue: 131

# Master switch for the Step 4.5 fleet-status digest. false = skip the digest
# entirely (Step 4 still runs). The digest is a read-only projection over the
# enumeration Steps 1–2 already perform; it never merges, pushes, or branches.
digest: true

# File-class registry (DEC-S018). No automated reader (DEC-S040) — this is the
# reference a person consults before copying a file between seeds and a project.
# Maps glob patterns to one of:
#
#   logic      — byte-identical-by-design across projects. Safe to `cp` wholesale
#                in either direction; drift here is staleness, not customization.
#   context    — project-specific. Never copy. The project owns its version.
#   hybrid     — generic shell + per-project context file. Copy the shell only
#                (DEC-S019); the paired context file is project-owned.
#   presence   — must EXIST in every project; its contents are never compared
#                (DEC-S044). For a file distributed by hand per machine, where a
#                project legitimately carries a different revision but having no
#                copy at all is never right.
#   seeds-only — lives here and nowhere else. A project never holds a copy, so
#                its absence downstream is not drift.
#
# Order matters — first matching glob wins. A file not matched here has never
# been classified; treat it as unclassified rather than assuming a default, and
# decide deliberately before copying it.
#
# Seeds-side paths only. Map to project-side by hand:
#   dev/claude/skills/<name>/SKILL.md  ↔  .claude/skills/<name>/SKILL.md
#   dev/claude/agents/<name>.md        ↔  .claude/agents/<name>.md
#   dev/claude/scripts/<name>          ↔  scripts/<name>
#   dev/claude/CLAUDE.md               ↔  CLAUDE.md (repo root)
file-classes:
  - "dev/claude/skills/**": logic
  # Doc-integrity scripts (DEC-S036, DEC-S037). These became byte-identical
  # across projects the moment their editorial knobs moved out of the code:
  # the topic order and id families live in `docs/decisions/_config.json`, the
  # roster and exemption lists in `.claude/doc-check.json`. A project that
  # needs different behavior edits its config, never the script — so drift in
  # the script itself is staleness, which is exactly what `logic` handles.
  # Seeds-side only: /its-alive invokes it from the seeds checkout, so a project
  # never holds a copy and its absence is not drift. Listed BEFORE the scripts
  # glob because first match wins.
  - "dev/claude/scripts/drift.mjs": seeds-only
  # Installed to ~/.claude/ per MACHINE, not to any repo (DEC-S045). A project holding
  # a copy would be the mistake, so `logic` — which reads its absence as drift — had
  # every project reporting a missing file it must never have. Caught on chiplog's
  # first drift run after the hook landed. Listed before the scripts glob: first match wins.
  - "dev/claude/scripts/tape-capture.sh": seeds-only
  - "dev/claude/scripts/**": logic
  # The permission policy (DEC-S023, DEC-S044). Neither `logic` nor `context`:
  # its CONTENTS are distributed by hand per machine and a project may legitimately
  # carry a different revision, so comparing them would be noise and would imply
  # seeds' copy wins — an opinion the differ must never hold. Its PRESENCE is not a
  # matter of opinion. A project without this file has no repo-level policy at all,
  # and on phone/web sessions it is the only policy that reaches the container
  # (DEC-S023) — so its absence is silent and total. `presence` means: report when
  # missing, never diff.
  - "dev/claude/settings.json": presence
  - "dev/claude/agents/tape-reader.md": logic
  - "dev/claude/agents/ideas.md": logic   # generic curator — no project-specific content, byte-identical everywhere
  # Project-owned reviewers (DEC-S035). These three reason about the project's
  # *substance* — its architecture, its correctness rules, its design system —
  # so a good one is necessarily project-specific and cannot be derived from a
  # template. Seeds keeps `dev/claude/agents/*.md` as install-time starting
  # points (setup step 5 copies them once); after that each project owns its
  # copy and sync never touches it again.
  #
  # They were `hybrid` until 2026-07-24, which was a misclassification: hybrid
  # means "generic shell + paired `.claude/<name>-context.md`" (the DEC-S019
  # CLAUDE.md pattern), and no such context file exists for an agent. So they
  # fell through to full hunk classification and the machine forward-ported
  # template edits into hand-adapted reviewers. sheepdog's `@code-review` —
  # classifier purity, alert-path independence, "weight silent-failure bugs
  # heaviest" — is what that would have destroyed.
  #
  # Cost of `context`, accepted knowingly: a good idea that emerges in one
  # project's reviewer will never auto-surface for backporting. Harvesting into
  # the seeds template is a deliberate manual act.
  - "dev/claude/agents/ui-reviewer.md": context
  - "dev/claude/agents/architect.md": context
  - "dev/claude/agents/code-review.md": context
  - "dev/claude/CLAUDE.md": hybrid
  - "dev/claude/docs/SPEC.md": context
  - "dev/claude/docs/BRAND.md": context
  - "dev/claude/docs/DECISIONS.md": context
  # The record itself, its preamble, its topic order, and the doc-check
  # roster/exemption lists — all statements about one project. The scripts
  # above are shared; what they read never is.
  - "dev/claude/docs/decisions/**": context
  - "dev/claude/doc-check.json": context
  - "dev/claude/docs/PROJECT_PLAN.md": context
  - "dev/claude/docs/RETROSPECTIVES.md": context
  - "dev/claude/docs/USER_STORIES.md": context
  - "dev/claude/docs/FUTURE_IDEAS.md": context
